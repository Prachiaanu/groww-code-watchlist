[project]
name = "smart-market-watchlist"
version = "1.0.0"
description = "Backend for a smart market watchlist that surfaces what meaningfully changed."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
